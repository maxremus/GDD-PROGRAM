spring.application.name=GP

# ============================================================
# DATABASE — Aiven MySQL (production)
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# STRIPE — попълнете с реалните си ключове от Stripe Dashboard
# ============================================================

stripe.secret-key=${SK_STRIP}
stripe.webhook-secret=${WH_STRIP}

# ============================================================
# EMAIL — Brevo HTTP API (безплатно, 300 имейла/ден, без карта)
# ВАЖНО: Render блокира изходящите SMTP портове (25/465/587) на free tier
# от 26.09.2025 — затова НЕ ползваме SMTP, а HTTPS API (порт 443, не се блокира).
# Регистрация: https://app.brevo.com → SMTP & API → API Keys → генерирай ключ.
# Изисква се и верифициран "sender" имейл в Brevo (Senders, Domains & Dedicated IPs).
# Ако BREVO_API_KEY не е зададен, известията по имейл се пропускат тихо.
# ============================================================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.mail.from-name=GDD Program

# ============================================================
# OCR — Tesseract (безплатен, self-hosted — виж Dockerfile)
# ============================================================
# ============================================================
# OCR — Google Gemini API (безплатен щедър лимит, разбира и ръкописен текст)
# Ключ: https://aistudio.google.com/apikey
# ============================================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-flash-latest
gemini.timeout-seconds=45

# ============================================================
# BACKUP — автоматичен backup на MySQL базата (mysqldump)
# ВНИМАНИЕ: ако сървърът (напр. Render free план) няма постоянен диск,
# файловете в BACKUP_DIR ще се изтрият при рестарт/redeploy!
# Затова всеки backup се изпраща и по имейл (ако BACKUP_NOTIFY_EMAIL е зададен).
# ============================================================
app.backup.dir=${BACKUP_DIR:/app/backups}
app.backup.cron=${BACKUP_CRON:0 0 3 * * *}
app.backup.retention=${BACKUP_RETENTION:14}
app.backup.notify-email=${BACKUP_NOTIFY_EMAIL:}

# ============================================================
# APP — Render URL
# ============================================================
app.base-url=https://gdd-program.onrender.com

# Снимки от телефон могат да са 5-10MB преди сървърна компресия
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Сесията изтича след 12 часа бездействие (по подразбиране Spring е 30 мин —
# твърде кратко за счетоводна работа с прекъсвания през деня).
server.servlet.session.timeout=12h

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=gdd-program


# ============================================================
# SERVER — Render използва PORT environment variable
# ============================================================
server.port=${PORT:8080}

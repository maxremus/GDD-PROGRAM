spring.application.name=GP

# ============================================================
# DATABASE — Aiven MySQL (production)
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# STRIPE — попълнете с реалните си ключове от Stripe Dashboard
# ============================================================

stripe.secret-key=${SK_STRIP}
stripe.webhook-secret=${WH_STRIP}

# ============================================================
# EMAIL — SMTP конфигурация (по подразбиране Gmail SMTP + App Password)
# Ако MAIL_USERNAME не е зададен, известията по имейл се пропускат тихо.
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from-name=GDD Program

# ============================================================
# BACKUP — автоматичен backup на MySQL базата (mysqldump)
# ВНИМАНИЕ: ако сървърът (напр. Render free план) няма постоянен диск,
# файловете в BACKUP_DIR ще се изтрият при рестарт/redeploy!
# Затова всеки backup се изпраща и по имейл (ако BACKUP_NOTIFY_EMAIL е зададен).
# ============================================================
app.backup.dir=${BACKUP_DIR:/app/backups}
app.backup.cron=${BACKUP_CRON:0 0 3 * * *}
app.backup.retention=${BACKUP_RETENTION:14}
app.backup.notify-email=${BACKUP_NOTIFY_EMAIL:}

# ============================================================
# APP — Render URL
# ============================================================
app.base-url=https://gdd-program.onrender.com

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=gdd-program


# ============================================================
# SERVER — Render използва PORT environment variable
# ============================================================
server.port=${PORT:8080}

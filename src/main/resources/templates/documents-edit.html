<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Преглед на документ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-radius: 14px;
            padding: 22px 28px; margin-bottom: 24px;
        }
        .card { border: none; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.07); }
        .doc-image { width: 100%; border-radius: 12px; border: 1px solid #eee; }
        .ocr-text {
            background: #f8f9fa; border-radius: 10px; padding: 12px;
            font-size: .78rem; color: #666; max-height: 220px; overflow-y: auto;
            white-space: pre-wrap; font-family: monospace;
        }
        label.form-label { font-size: .82rem; font-weight: 600; color: #444; }

        .info-tip {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 50%;
            background: #e0e4f5; color: #667eea; font-size: .68rem; font-weight: 700;
            cursor: help; position: relative; margin-left: 4px; font-style: normal;
        }
        .info-tip::after {
            content: attr(data-tip);
            position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
            background: #2b2b3a; color: #fff; font-size: .74rem; font-weight: 400;
            padding: 8px 10px; border-radius: 8px; width: 220px;
            opacity: 0; visibility: hidden; transition: opacity .15s ease;
            pointer-events: none; z-index: 20; line-height: 1.4; text-align: left;
        }
        .info-tip::before {
            content: ""; position: absolute; bottom: 122%; left: 50%; transform: translateX(-50%);
            border: 6px solid transparent; border-top-color: #2b2b3a;
            opacity: 0; visibility: hidden; transition: opacity .15s ease;
        }
        .info-tip:hover::after, .info-tip:hover::before { opacity: 1; visibility: visible; }
    </style>
</head>
<body>
<div class="container-fluid py-4 px-4">

    <div class="page-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">🔍 Преглед и корекция на документ</h5>
        <div class="d-flex gap-2">
            <a th:href="@{/companies}" class="btn btn-light btn-sm">🏢 Начало</a>
            <a th:href="@{/documents}" class="btn btn-light btn-sm">← Обратно към списъка</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        ✅ <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- ЛЯВО: снимка(и) + OCR текст -->
        <div class="col-lg-5">
            <div class="card p-3">
                <div th:if="${doc.pageCount > 1}" class="mb-2">
                    <span class="badge bg-secondary">📑 Документ от ${doc.pageCount} листа</span>
                </div>

                <img th:if="${#strings.startsWith(doc.contentType,'image/')}"
                     th:src="@{'/documents/' + ${doc.id} + '/image'}" class="doc-image" alt="документ, стр. 1">

                <div th:if="${!#lists.isEmpty(pages)}" class="d-flex gap-2 flex-wrap mt-2">
                    <img th:each="p : ${pages}"
                         th:src="@{'/documents/' + ${doc.id} + '/page/' + ${p.pageNumber}}"
                         class="doc-image" style="max-width:110px;cursor:pointer;"
                         th:onclick="|window.open('/documents/${doc.id}/page/${p.pageNumber}', '_blank')|"
                         alt="допълнителна страница">
                </div>

                <div th:if="${doc.warnings != null and !#strings.isEmpty(doc.warnings)}" class="alert alert-warning mt-3 mb-0 py-2">
                    ⚠️ <strong>Забележка от анализа:</strong> <span th:text="${doc.warnings}"></span>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <label class="form-label mb-0">📝 Разпознат текст (OCR) — само за справка</label>
                    <form th:action="@{'/documents/' + ${doc.id} + '/retry-ocr'}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">🔄 Повтори OCR</button>
                    </form>
                </div>

                <div class="ocr-text mt-2" th:if="${doc.ocrText != null and !#strings.startsWith(doc.ocrText,'[OCR')}"
                     th:text="${doc.ocrText}"></div>

                <div class="alert alert-danger mt-2 mb-0 py-2" th:if="${doc.ocrText != null and #strings.startsWith(doc.ocrText,'[OCR')}">
                    ⚠️ <span th:text="${doc.ocrText}"></span>
                </div>

                <div class="alert alert-warning mt-2 mb-0 py-2" th:if="${doc.ocrText == null}">
                    ⏳ OCR обработката още не е готова. Изчакайте няколко секунди и презаредете, или натиснете "Повтори OCR".
                </div>
            </div>
        </div>

        <!-- ДЯСНО: форма за корекция -->
        <div class="col-lg-7">
            <div class="card p-4">
                <form th:action="@{'/documents/' + ${doc.id} + '/edit'}" method="post">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Тип документ<span class="info-tip" data-tip="Ф-ра = фактура, ДИ = дебитно известие, КИ = кредитно известие, ПКО/РКО = касов ордер.">ⓘ</span></label>
                            <select name="documentType" class="form-select">
                                <option th:each="t : ${T(java.util.List).of('Ф-ра','ДИ','КИ','МД','Прот','ОП','ОПС','ПКО','РКО','МО','ББ','ПН')}"
                                        th:value="${t}" th:text="${t}" th:selected="${t == doc.documentType}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Номер на документ<span class="info-tip" data-tip="Номерът на фактурата/бележката, изписан горе вдясно на документа.">ⓘ</span></label>
                            <input type="text" name="documentNumber" class="form-control" th:value="${doc.documentNumber}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Дата на документа<span class="info-tip" data-tip="Датата, на която е издаден документът (не днешната дата).">ⓘ</span></label>
                            <input type="date" name="documentDate" class="form-control" th:value="${doc.documentDate}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Обща сума (с ДДС)<span class="info-tip" data-tip="Крайната сума за плащане, както е изписана на документа.">ⓘ</span></label>
                            <input type="number" step="0.01" name="totalAmount" class="form-control" th:value="${doc.totalAmount}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Стойност на ДДС <span class="text-muted fw-normal">(-1 = автоматично)</span><span class="info-tip" data-tip="Оставете -1, ако искате Делта Про сама да изчисли ДДС от общата сума.">ⓘ</span></label>
                            <input type="number" step="0.01" name="vatAmount" class="form-control" th:value="${doc.vatAmount}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Данъчна група (1-27)<span class="info-tip" data-tip="Код по таблицата на Микроинвест за данъчни групи — питайте счетоводителя си кой номер важи, ако не сте сигурни.">ⓘ</span></label>
                            <input type="number" name="vatType" class="form-control" th:value="${doc.vatType}" placeholder="напр. 1 = ДК">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Операция/контировка<span class="info-tip" data-tip="Предефинирана операция (число 1-8) или ръчна счетоводна контировка (напр. 304%-401).">ⓘ</span></label>
                            <input type="text" name="operationType" class="form-control" th:value="${doc.operationType}" placeholder="1-8 или напр. 304%-401">
                        </div>

                        <div class="col-12"><hr class="my-1"></div>

                        <div class="col-md-6">
                            <label class="form-label">Ime на партньора<span class="info-tip" data-tip="Доставчикът/фирмата, издала документа (не вашата кантора).">ⓘ</span></label>
                            <input type="text" name="partnerName" class="form-control" th:value="${doc.partnerName}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">МОЛ на партньора<span class="info-tip" data-tip="Материално отговорно лице — обикновено управителят на фирмата-партньор.">ⓘ</span></label>
                            <input type="text" name="partnerMol" class="form-control" th:value="${doc.partnerMol}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Град</label>
                            <input type="text" name="partnerCity" class="form-control" th:value="${doc.partnerCity}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Адрес</label>
                            <input type="text" name="partnerAddress" class="form-control" th:value="${doc.partnerAddress}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">ДДС номер<span class="info-tip" data-tip="напр. BG831826092 — само ако партньорът е регистриран по ДДС.">ⓘ</span></label>
                            <input type="text" name="partnerVatNumber" class="form-control" th:value="${doc.partnerVatNumber}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Булстат/ЕИК<span class="info-tip" data-tip="9 или 13-цифреният идентификатор на фирмата-партньор.">ⓘ</span></label>
                            <input type="text" name="partnerBulstat" class="form-control" th:value="${doc.partnerBulstat}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Банка и сметка<span class="info-tip" data-tip="По избор — само ако плащането е по банков път и искате да го отбележите.">ⓘ</span></label>
                            <input type="text" name="bankAccount" class="form-control" th:value="${doc.bankAccount}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Описание на сделката<span class="info-tip" data-tip="Кратък текст за какво е документът, напр. 'Строителни материали'.">ⓘ</span></label>
                            <input type="text" name="description" class="form-control" th:value="${doc.description}">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-lg text-white"
                                style="background:linear-gradient(135deg,#667eea,#764ba2);">
                            ✅ Запази и маркирай като прегледано
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

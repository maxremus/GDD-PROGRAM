<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Банкови извлечения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .page-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white; border-radius: 14px;
            padding: 22px 28px; margin-bottom: 24px;
        }
        .card { border: none; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.07); }
        table input, table select { font-size: .8rem; padding: 4px 6px; }
        .status-badge { font-size: .68rem; }
        .row-in { background: #eafbea; }
        .row-out { background: #fff4f0; }
    </style>
</head>
<body>
<div class="container-fluid py-4 px-4">

    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h4 class="mb-0 fw-bold">🏦 Банкови извлечения</h4>
            <small class="opacity-75">Прегледай и коригирай преди износ към Делта Про</small>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/companies}" class="btn btn-light btn-sm">🏢 Начало</a>
            <button type="button" class="btn btn-success btn-sm" onclick="exportSelected()">📤 Експорт (XML)</button>
            <a th:href="@{/bank-statements/upload}" class="btn btn-light btn-sm">⬆️ Качи извлечение</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        ✅ <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        ❌ <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header bg-light d-flex justify-content-between">
            <span>📋 Транзакции</span>
            <span class="badge bg-secondary" th:text="${#lists.size(transactions)} + ' общо'"></span>
        </div>
        <div class="card-body p-0" style="overflow-x:auto;">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th></th>
                    <th>Дата</th>
                    <th>Посока</th>
                    <th>Сума</th>
                    <th>Контрагент</th>
                    <th>IBAN</th>
                    <th>Основание</th>
                    <th>Фирма</th>
                    <th>Наша сметка</th>
                    <th>Насрещна сметка</th>
                    <th>Статус</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tx : ${transactions}" th:classappend="${tx.direction.name() == 'IN'} ? 'row-in' : 'row-out'">
                    <td>
                        <form th:id="'form-' + ${tx.id}" th:action="@{'/bank-statements/' + ${tx.id} + '/edit'}" method="post" style="display:none;"></form>
                        <input type="checkbox" class="tx-checkbox" th:value="${tx.id}">
                    </td>
                    <td><input type="date" name="transactionDate" th:value="${tx.transactionDate}" th:form="'form-' + ${tx.id}" class="form-control form-control-sm" style="width:130px;"></td>
                    <td>
                        <select name="direction" th:form="'form-' + ${tx.id}" class="form-select form-select-sm" style="width:90px;">
                            <option value="IN" th:selected="${tx.direction.name() == 'IN'}">⬇️ Вход</option>
                            <option value="OUT" th:selected="${tx.direction.name() == 'OUT'}">⬆️ Изход</option>
                        </select>
                    </td>
                    <td><input type="number" step="0.01" name="amount" th:value="${tx.amount}" th:form="'form-' + ${tx.id}" class="form-control form-control-sm" style="width:90px;"></td>
                    <td><input type="text" name="counterpartyName" th:value="${tx.counterpartyName}" th:form="'form-' + ${tx.id}" class="form-control form-control-sm" style="width:150px;"></td>
                    <td><input type="text" name="counterpartyIban" th:value="${tx.counterpartyIban}" th:form="'form-' + ${tx.id}" class="form-control form-control-sm" style="width:150px;"></td>
                    <td><input type="text" name="description" th:value="${tx.description}" th:form="'form-' + ${tx.id}" class="form-control form-control-sm" style="width:180px;"></td>
                    <td>
                        <select name="companyId" th:form="'form-' + ${tx.id}" class="form-select form-select-sm" style="width:150px;">
                            <option value="">—</option>
                            <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"
                                    th:selected="${tx.companyId != null and tx.companyId == c.id}"></option>
                        </select>
                    </td>
                    <td><input type="text" name="ourAccount" th:value="${tx.ourAccount}" th:form="'form-' + ${tx.id}" class="form-control form-control-sm" style="width:70px;"></td>
                    <td><input type="text" name="counterAccount" th:value="${tx.counterAccount}" th:form="'form-' + ${tx.id}" class="form-control form-control-sm" style="width:80px;"></td>
                    <td>
                        <span class="badge status-badge"
                              th:classappend="${tx.status.name() == 'NEW' ? 'bg-warning text-dark' : (tx.status.name() == 'REVIEWED' ? 'bg-info text-dark' : 'bg-success')}"
                              th:text="${tx.status.name() == 'NEW' ? 'Ново' : (tx.status.name() == 'REVIEWED' ? 'Прегледано' : 'Експортирано')}">
                        </span>
                    </td>
                    <td class="d-flex gap-1">
                        <button type="submit" th:form="'form-' + ${tx.id}" class="btn btn-sm btn-outline-primary" style="font-size:.7rem;">💾</button>
                        <form th:action="@{'/bank-statements/' + ${tx.id} + '/delete'}" method="post" class="d-inline"
                              onsubmit="return confirm('Да изтрия ли тази транзакция?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger" style="font-size:.7rem;">🗑️</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="12" class="text-center text-muted py-4">
                        Няма качени извлечения. <a th:href="@{/bank-statements/upload}">Качи първото</a>.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const exportUrl = /*[[@{/bank-statements/export-xml}]]*/ '/bank-statements/export-xml';

    function exportSelected() {
        const checked = document.querySelectorAll('.tx-checkbox:checked');
        if (checked.length === 0) {
            alert('Моля, изберете поне една транзакция (чекбокс в първата колона).');
            return;
        }
        const ids = Array.from(checked).map(cb => cb.value);
        const params = ids.map(id => 'ids=' + encodeURIComponent(id)).join('&');
        window.location.href = exportUrl + '?' + params;
    }
</script>
</body>
</html>

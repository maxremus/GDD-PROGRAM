<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Смяна на парола</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.09); max-width: 480px; margin: 60px auto; }
        .card-header { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px 16px 0 0 !important; color: white; padding: 22px 28px; }
        .form-control { border-radius: 10px; padding: 11px 14px; }
        .btn-save { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 10px; padding: 12px; font-weight: 600; }
        .pw-wrap { position: relative; }
        .pw-wrap .toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; cursor: pointer; font-size: .95rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">🔑 Смяна на парола</h5>
        </div>
        <div class="card-body p-4">

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                ✅ <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                ❌ <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/change-password}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Текуща парола</label>
                    <div class="pw-wrap">
                        <input type="password" id="cp1" name="currentPassword" class="form-control"
                               placeholder="Въведете текущата парола" required>
                        <button type="button" class="toggle" onclick="toggle('cp1',this)">👁</button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Нова парола</label>
                    <div class="pw-wrap">
                        <input type="password" id="cp2" name="newPassword" class="form-control"
                               placeholder="Минимум 6 символа" minlength="6" required>
                        <button type="button" class="toggle" onclick="toggle('cp2',this)">👁</button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Потвърди нова парола</label>
                    <div class="pw-wrap">
                        <input type="password" id="cp3" name="confirmPassword" class="form-control"
                               placeholder="Повтори новата парола" minlength="6" required>
                        <button type="button" class="toggle" onclick="toggle('cp3',this)">👁</button>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn text-white btn-save">💾 Запази новата парола</button>
                </div>
            </form>

            <div class="text-center">
                <a th:href="@{/companies}" class="btn btn-outline-secondary btn-sm">⬅ Назад</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggle(id, btn) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
    btn.textContent = el.type === 'password' ? '👁' : '🙈';
}
document.querySelector('form').addEventListener('submit', function(e) {
    const p2 = document.getElementById('cp2').value;
    const p3 = document.getElementById('cp3').value;
    if (p2 !== p3) { e.preventDefault(); alert('Новите пароли не съвпадат!'); }
});
</script>
</body>
</html>

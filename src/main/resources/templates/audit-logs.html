<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Одит на действията</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .page-header {
            background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
            color: white; border-radius: 14px;
            padding: 22px 28px; margin-bottom: 24px;
        }
        .card { border: none; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.07); }
        .card-header { border-radius: 14px 14px 0 0 !important; font-weight: 600; }
        .table th { font-size: .8rem; color: #666; text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
        .table td { vertical-align: middle; font-size: .88rem; }
        .details-cell { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .details-cell:hover { white-space: normal; overflow: visible; }
        code.uri { font-size: .78rem; }
    </style>
</head>
<body>
<div class="container-fluid py-4 px-4">

    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-0 fw-bold">🧾 Одит на действията</h4>
            <small class="opacity-75">Пълен лог на всички действия в системата — достъпен само за администратор</small>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/backups}" class="btn btn-light btn-sm">🗄️ Backup</a>
            <a th:href="@{/admin/users}" class="btn btn-light btn-sm">🔧 Системен панел</a>
            <a th:href="@{/companies}" class="btn btn-light btn-sm">🏢 Начало</a>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-outline-light btn-sm">🚪 Изход</button>
            </form>
        </div>
    </div>

    <!-- Филтри -->
    <div class="card mb-3">
        <div class="card-body">
            <form method="get" th:action="@{/admin/audit-logs}" class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small text-muted">Потребител</label>
                    <input type="text" name="username" th:value="${username}" class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Действие</label>
                    <input type="text" name="action" th:value="${action}" placeholder="напр. companies.add"
                           class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">IP адрес</label>
                    <input type="text" name="ipAddress" th:value="${ipAddress}" class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">От дата</label>
                    <input type="date" name="dateFrom" th:value="${dateFrom}" class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">До дата</label>
                    <input type="date" name="dateTo" th:value="${dateTo}" class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Статус</label>
                    <select name="successOnly" class="form-select form-select-sm">
                        <option value="">Всички</option>
                        <option value="true" th:selected="${successOnly != null and successOnly}">Само успешни</option>
                        <option value="false" th:selected="${successOnly != null and !successOnly}">Само неуспешни</option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2 mt-2">
                    <button type="submit" class="btn btn-primary btn-sm">🔍 Филтрирай</button>
                    <a th:href="@{/admin/audit-logs}" class="btn btn-outline-secondary btn-sm">Изчисти</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-light text-dark d-flex justify-content-between">
            <span>📋 Записи</span>
            <span class="badge bg-secondary" th:text="${page.totalElements} + ' общо'"></span>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Дата/час</th>
                    <th>Потребител</th>
                    <th>Роля</th>
                    <th>Действие</th>
                    <th>Метод</th>
                    <th>URL</th>
                    <th>Детайли</th>
                    <th>IP</th>
                    <th class="text-center">Статус</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#temporals.format(log.timestamp, 'dd.MM.yyyy HH:mm:ss')}"></td>
                    <td><strong th:text="${log.username}"></strong></td>
                    <td><span class="text-muted small" th:text="${log.role != null ? #strings.replace(log.role,'ROLE_','') : '—'}"></span></td>
                    <td><code th:text="${log.action}"></code></td>
                    <td><span class="badge bg-dark" th:text="${log.httpMethod}"></span></td>
                    <td><code class="uri text-muted" th:text="${log.requestUri}"></code></td>
                    <td class="details-cell" th:text="${log.success ? log.details : log.errorMessage}"
                        th:title="${log.details}"></td>
                    <td class="text-muted small" th:text="${log.ipAddress}"></td>
                    <td class="text-center">
                        <span th:if="${log.success}" class="badge bg-success">OK</span>
                        <span th:unless="${log.success}" class="badge bg-danger">ГРЕШКА</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="9" class="text-center text-muted py-4">Няма намерени записи.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Пагинация -->
    <nav th:if="${page.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center">
            <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/audit-logs(page=${page.number - 1}, username=${username}, action=${action}, ipAddress=${ipAddress}, dateFrom=${dateFrom}, dateTo=${dateTo}, successOnly=${successOnly})}">‹ Назад</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Стр. ' + (${page.number} + 1) + ' от ' + ${page.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${page.number + 1 >= page.totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/audit-logs(page=${page.number + 1}, username=${username}, action=${action}, ipAddress=${ipAddress}, dateFrom=${dateFrom}, dateTo=${dateTo}, successOnly=${successOnly})}">Напред ›</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>

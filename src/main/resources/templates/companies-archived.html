<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Архивирани фирми</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .page-header {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white; border-radius: 14px;
            padding: 22px 28px; margin-bottom: 24px;
        }
        .card { border: none; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.07); }
        .table th { font-size: .8rem; color: #666; text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
        .table td { vertical-align: middle; }
    </style>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="container-fluid py-4 px-4">

    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-0 fw-bold">📦 Архивирани фирми</h4>
            <small class="opacity-75">Скрити от основния списък, но не са изтрити — можете да ги възстановите по всяко време</small>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        ✅ <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        ❌ <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header bg-light text-dark d-flex justify-content-between">
            <span>📋 Архив</span>
            <span class="badge bg-secondary" th:text="${#lists.size(companies)} + ' общо'"></span>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Ime на фирмата</th>
                    <th>Година</th>
                    <th>Архивирана на</th>
                    <th class="text-center">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="company : ${companies}">
                    <td><strong th:text="${company.name}"></strong></td>
                    <td th:text="${company.year}"></td>
                    <td th:text="${company.archivedAt != null ? #temporals.format(company.archivedAt, 'dd.MM.yyyy HH:mm') : '—'}"></td>
                    <td class="text-center">
                        <form th:action="@{/companies/restore/{id}(id=${company.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success">↩️ Възстанови</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(companies)}">
                    <td colspan="4" class="text-center text-muted py-4">Няма архивирани фирми.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

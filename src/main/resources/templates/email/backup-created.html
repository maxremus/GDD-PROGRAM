<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f4f6fb;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08);">
                <tr>
                    <td style="background:#20c997;padding:26px 28px;">
                        <h2 style="margin:0;color:#ffffff;font-size:20px;">🗄️ Backup на базата данни</h2>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;color:#333333;font-size:15px;line-height:1.6;">
                        <p>Автоматичен backup на базата данни беше създаден успешно.</p>
                        <table role="presentation" width="100%" style="font-size:14px;margin-top:12px;">
                            <tr>
                                <td style="color:#888;padding:4px 0;">Файл:</td>
                                <td style="font-weight:bold;" th:text="${fileName}">backup.sql.gz</td>
                            </tr>
                            <tr>
                                <td style="color:#888;padding:4px 0;">Размер:</td>
                                <td th:text="${fileSize}">1.2 MB</td>
                            </tr>
                            <tr>
                                <td style="color:#888;padding:4px 0;">Дата/час:</td>
                                <td th:text="${timestamp}">01.01.2026 03:00</td>
                            </tr>
                        </table>
                        <p style="margin-top:20px;">Архивът е приложен към това писмо. Пазете го на сигурно място.</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px;background:#f4f6fb;color:#999999;font-size:12px;">
                        Това е автоматично известие от GDD Program. Моля, не отговаряйте на този имейл.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сканирай документ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-radius: 14px;
            padding: 22px 28px; margin-bottom: 24px;
        }
        .card { border: none; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.07); }
        .capture-btn {
            display: block; width: 100%; padding: 40px 20px;
            border: 3px dashed #764ba2; border-radius: 16px;
            background: #f8f6ff; text-align: center; cursor: pointer;
            transition: .2s;
        }
        .capture-btn:hover { background: #f0ecff; border-color: #5a3d99; }
        .capture-btn .icon { font-size: 3rem; display: block; margin-bottom: 10px; }
        #previewImg { max-width: 100%; border-radius: 12px; margin-top: 16px; display: none; }
        #fileName { font-size: .85rem; color: #666; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 560px;">

    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0 fw-bold">📷 Сканирай документ</h5>
            <small class="opacity-75">Снимай фактура/касова бележка директно от телефона</small>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/companies}" class="btn btn-light btn-sm">🏢 Начало</a>
            <a th:href="@{/documents}" class="btn btn-light btn-sm">📄 Документи</a>
        </div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        ❌ <span th:text="${errorMessage}"></span>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <form th:action="@{/documents/upload}" method="post" enctype="multipart/form-data" id="scanForm">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Фирма (по избор)</label>
                    <select name="companyId" class="form-select">
                        <option value="">— без избрана фирма —</option>
                        <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name} + ' (' + ${c.year} + ')'"></option>
                    </select>
                </div>

                <label class="capture-btn" for="fileInput">
                    <span class="icon">📸</span>
                    <span class="fw-semibold">Снимай или избери файл</span>
                    <div id="fileName">Няма избрана снимка</div>
                </label>
                <input type="file" id="fileInput" name="file" accept="image/*" capture="environment"
                       required style="display:none;" onchange="previewFile(this)">

                <img id="previewImg" alt="Преглед">

                <div class="mb-3 mt-3">
                    <label class="form-label fw-semibold">Бележка (по избор)</label>
                    <textarea name="note" class="form-control" rows="2"
                              placeholder="напр. фактура за м. юли, доставчик X"></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-lg text-white"
                            style="background:linear-gradient(135deg,#667eea,#764ba2);">
                        ⬆️ Качи документа
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function previewFile(input) {
        const fileNameEl = document.getElementById('fileName');
        const previewImg = document.getElementById('previewImg');
        if (input.files && input.files[0]) {
            fileNameEl.textContent = input.files[0].name;
            const reader = new FileReader();
            reader.onload = e => {
                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Нова парола</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: white; border-radius: 20px; padding: 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
        }
        .login-title { font-size: 1.5rem; font-weight: 700; color: #222; }
        .login-subtitle { color: #888; font-size: .9rem; margin-bottom: 28px; }
        .form-control { border-radius: 10px; padding: 12px 14px; border: 1.5px solid #e0e0e0; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 10px; padding: 13px;
            font-size: 1rem; font-weight: 600;
        }
        .btn-login:hover { opacity: .9; }
        .back-link {
            display: block; text-align: center; margin-top: 18px;
            color: #667eea; font-size: .9rem; text-decoration: none; font-weight: 600;
        }
        .back-link:hover { color: #5a6fd6; }
        .pw-wrap { position: relative; }
        .pw-wrap .toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #999; cursor: pointer; font-size: 1.05rem;
        }
        .pw-wrap .toggle:hover { color: #667eea; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-3">
            <span style="font-size:2.8rem;">🔐</span>
        </div>
        <div class="text-center">
            <div class="login-title">Задайте нова парола</div>
            <div class="login-subtitle">Изберете нова парола за акаунта си</div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 mb-3">
            ❌ <span th:text="${errorMessage}"></span>
        </div>

        <div th:unless="${valid}" class="alert alert-warning py-2 mb-3">
            ⚠️ Линкът е невалиден или изтекъл. Моля, заявете нов от
            <a th:href="@{/forgot-password}">"Забравена парола"</a>.
        </div>

        <form th:if="${valid}" th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Нова парола</label>
                <div class="pw-wrap">
                    <input type="password" id="rp1" name="newPassword" class="form-control"
                           placeholder="Поне 6 символа" minlength="6" required autofocus>
                    <button type="button" class="toggle" onclick="toggleReset('rp1',this)">👁</button>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Потвърди паролата</label>
                <div class="pw-wrap">
                    <input type="password" id="rp2" name="confirmPassword" class="form-control"
                           placeholder="Повторете паролата" minlength="6" required>
                    <button type="button" class="toggle" onclick="toggleReset('rp2',this)">👁</button>
                </div>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn text-white btn-login">💾 Запази новата парола</button>
            </div>
        </form>

        <a th:href="@{/login}" class="back-link">← Обратно към вход</a>
    </div>

    <script>
        function toggleReset(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
            else { input.type = 'password'; btn.textContent = '👁'; }
        }
    </script>
</body>
</html>
